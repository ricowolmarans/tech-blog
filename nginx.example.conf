# Drop this in /etc/nginx/sites-available/tech-blog and symlink to sites-enabled
# Adjust server_name to whatever local/private domain you use for this.

server {
    listen 80;
    server_name blog.internal;  # not public-facing

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 25M;  # allow decent-sized image uploads
}
